[project]
name = "eda-artifacts"
version = "0.1.0"
description = "Notebookless, LLM-assisted EDA with versioned query, chart, and report artifacts"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "duckdb>=1.5.4",
    "pyarrow>=24.0.0",
    "langgraph>=1.2.6",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3",
    "pyright>=1.1.407",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["eda_artifacts", "tests"]
extend-exclude = [
    "runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
